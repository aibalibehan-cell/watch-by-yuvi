		<style>

			}
			#loader div {

				}

				}
			}

			.progress-arc {
				transform: rotate(-180deg) scale(-1, 1);
				transform-origin: center;
				stroke-dasharray: 2168;
				stroke-dashoffset: 2168;
				animation: fill-circle 1.2s ease-in-out forwards;
			}

			@keyframes fill-circle {
				from { stroke-dashoffset: 2168; }
				to   { stroke-dashoffset: 0; }
			}
		</style>
		<script>
			function handleLoaderFade() {
				setTimeout(function() {
					var loader = document.getElementById('loader');
					if (loader) {
						loader.style.pointerEvents = 'none';
						loader.style.transition = 'opacity 0.6s ease';
						loader.style.opacity = '0';
						setTimeout(function() {
							loader.style.display = 'none';
						}, 650);
					}
				}, 1800);
			}

			if (window.location.protocol === 'file:') {
				fetch('./favicon.png').then(function() {
					window.addEventListener('load', handleLoaderFade);
				}).catch(function() {
					fetch('http://localhost:3000/').then(function() {
						window.location.href = 'http://localhost:3000/';
					}).catch(function() {
						function showNotice() {
							var loaderText = document.querySelector('#loader div');
							var loaderSvg = document.querySelector('#loader svg');
							if (loaderSvg) loaderSvg.style.display = 'none';
							if (loaderText) {
								loaderText.style.textAlign = 'center';
								loaderText.style.lineHeight = '1.6';
								loaderText.innerHTML = '<div style="background:#fff;border-radius:12px;padding:24px 32px;box-shadow:0 8px 30px rgba(0,0,0,0.12);max-width:440px;"><div style="font-size:32px;margin-bottom:8px;">⏱️</div><div style="font-size:17px;font-weight:700;color:#111;margin-bottom:8px;">FS 60P Watch</div><div style="font-size:13px;color:#555;line-height:1.5;">Modern browsers restrict binary 3D models (.glb) on <code>file://</code> due to security rules.<br><br>👉 Run <b>node server.js</b> to launch at <code>http://localhost:3000</code> or open the live site at <a href="https://watch-by-yuvi.pages.dev" target="_blank" style="color:#000;text-decoration:underline;">watch-by-yuvi.pages.dev</a>.</div></div>';
							}
						}
						if (document.readyState === 'loading') {
							document.addEventListener('DOMContentLoaded', showNotice);
						} else {
							showNotice();
						}
					});
				});
			} else {
				window.addEventListener('load', handleLoaderFade);
			}
		</script>
